[package]
name = "cmsg"
version = "0.1.0"
edition = "2024"

[dependencies]
ignore = "0.4.25"
eyre = "0.6.12"
clap = { version = "4.6.5", features = ["derive", "cargo"] }
sha2 = "0.11.0"
fastrand = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
pathdiff = "0.2.3"

[profile.prod]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
